<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relief — brush tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --line:#111111; --soft:#d6d6d6; --text:#111111; --dim:#7a7a7a;
  --accent:#111111; --accent-ink:#ffffff; --field:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:10.5px;line-height:1.45;overflow:hidden;text-transform:uppercase;letter-spacing:.05em;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:.02em}
.brand span{color:var(--dim)}
.status{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;padding:12px}
#gl{display:block;touch-action:none;cursor:none;box-shadow:0 0 0 1px var(--line)}
#ring{position:absolute;left:0;top:0;border:1px solid #fff;border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%);display:none;mix-blend-mode:difference}
#hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  color:#8a8a92;transition:opacity .4s}
#hint.gone{opacity:0}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);
  padding:6px 10px;cursor:pointer;border-radius:0}
button:hover{background:var(--soft)}
button[aria-pressed="true"]:hover{background:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.bar .spacer{flex:1}
/* panel: columns share the width, wrap instead of scrolling, 1px gaps draw the grid lines */
.panel{border-top:1px solid var(--line);background:var(--line);display:flex;flex-wrap:wrap;gap:1px;flex:0 0 auto;overflow:hidden}
details{background:var(--panel);flex:1 1 170px;min-width:0;overflow:hidden}
details:first-child{flex-basis:220px}
details.wide{flex-basis:270px}
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
summary{list-style:none;cursor:default;pointer-events:none;padding:9px 14px 7px;display:flex;justify-content:space-between;font-weight:600}
summary::-webkit-details-marker{display:none}
.sec{padding:0 14px 11px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px 16px;align-content:start}
.sec>:not(.row){grid-column:1/-1}
.note{color:var(--dim);font-size:11px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seg button{padding:6px 2px}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mat{display:grid;gap:3px;justify-items:center;padding:5px 2px;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mat img,.mat i{width:30px;height:30px;display:block;font-style:normal;font-size:20px;line-height:30px;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw{width:26px;height:26px;padding:0;border-radius:2px}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px;background:inherit}
.wheel{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:2px;cursor:pointer;overflow:hidden;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;background:#111}
.wheel i{display:block}
.wheel:hover{background:#111;opacity:.85}
/* apple-style colour popover */
#cp{position:fixed;z-index:50;width:244px;padding:14px;border-radius:16px;background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.18);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  text-transform:none;letter-spacing:0;font-size:13px;color:#1d1d1f;display:none;
  opacity:0;transform:translateY(6px) scale(.98);transition:opacity .16s ease,transform .16s ease}
#cp.open{opacity:1;transform:none}
#cp .sv{position:relative;height:152px;border-radius:10px;cursor:default;touch-action:none;
  background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent)}
#cp .hue{position:relative;height:16px;margin-top:14px;border-radius:8px;cursor:pointer;touch-action:none;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#cp .knob{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;cursor:grab;transition:transform .12s ease;
  box-shadow:0 0 0 3px #fff,0 1px 6px rgba(0,0,0,.35)}
#cp .hue .knob{top:50%}
#cp .dragging .knob{cursor:grabbing;transform:scale(1.15)}
#cp .dragging{cursor:grabbing}
#cp .foot{display:flex;align-items:center;gap:10px;margin-top:14px}
#cp .prev{flex:0 0 30px;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
#cp .hex{flex:1;min-width:0;font:inherit;font-variant-numeric:tabular-nums;padding:7px 10px;border:0;border-radius:8px;background:rgba(118,118,128,.12);color:inherit;outline:none}
#cp .hex:focus{box-shadow:0 0 0 2px rgba(0,122,255,.5)}
#cp .done{font:inherit;font-weight:600;color:#1d1d1f;background:none;border:0;padding:6px 4px;cursor:pointer;text-transform:none;letter-spacing:0}
#cp .done:hover{background:none;opacity:.7}
.row{display:grid;gap:2px}
.row .lab{display:flex;justify-content:space-between}
.row .lab output{color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:#111}
input[type=range]::-moz-range-track{height:1px;background:#111}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;background:#fff;border:1px solid #111;border-radius:0}
input[type=range]::-moz-range-thumb{width:8px;height:8px;background:#fff;border:1px solid #111;border-radius:0}
input[type=range]:active::-webkit-slider-thumb{background:#111}
input[type=range]:active::-moz-range-thumb{background:#111}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:#111}
.keys{color:var(--dim);font-size:11px;padding:10px 14px;flex:0 0 auto;align-self:flex-end}
#err{display:none;padding:20px}
@media (max-width:760px){
  .panel{flex-wrap:nowrap;overflow-x:auto;max-height:42vh}
  details,details:first-child,details.wide{flex:0 0 auto;width:210px;overflow-y:auto}
  .keys{display:none}
  #gl{cursor:crosshair}
}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <div class="top">
      <div class="brand">relief<span>.</span></div>
      <div class="status" id="status">spray</div>
    </div>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="ring"></div>
      <div id="err">WebGL2 is not available in this browser.</div>
    </div>
    <div class="bar">
      <button id="undo" disabled>undo</button>
      <button id="clear">clear plate</button>
      <button id="reset">reset settings</button>
      <span class="spacer"></span>
      <div class="seg" id="xsz" style="display:flex;gap:3px" title="export size">
        <button data-s="1" aria-pressed="false">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="3" aria-pressed="true">3×</button>
      </div>
      <button id="expR" disabled>save canvas</button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <details open><summary>tool</summary><div class="sec">
      <div class="mats" id="mats"></div>
      <div class="swatches" id="sw"></div>
    </div></details>


    <details open id="layersD"><summary>layers</summary><div class="sec">
      <div class="seg" id="layers" style="grid-template-columns:1fr 1fr"></div>
      <div class="note" id="layerNote"></div>
    </div></details>
    <details open class="wide"><summary>form</summary><div class="sec" id="formSec"></div></details>
    <details open id="chaosD" class="wide"><summary>chaos</summary><div class="sec" id="chaosSec"></div></details>
    <details open id="threadD" class="wide"><summary>thread</summary><div class="sec" id="threadSec">
      <div class="seg" id="stitchSeg" style="grid-template-columns:1fr 1fr"></div>
    </div></details>
    <details open id="canD" class="wide"><summary>can</summary><div class="sec" id="canSec">
      <div class="note">hold still and the paint piles up and runs</div>
    </div></details>
    <details open class="wide"><summary>light</summary><div class="sec" id="lightSec"></div></details>
  </aside>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

// ---------- parameters ----------
const P = {
  tool:"spray", color:"#2b2e36", mode:"raise",
  flow:1, mist:0, spread:.5, stitch:"satin", thick:.35, density:.6, slant:20, fuzz:.4, drips:.5, splat:.35, gloss:.35,
  size:24, convex:.55, height:.6, fuse:.5,
  chaosW:.25, rough:.35, dents:.3, noise:.35,
  spine:0, welt:.22, velocity:true,
  lightA:-135, lightE:36, ao:0, depth:1,
  paper:"#ffffff",
  gAmt:0, gRange:8, gBal:1, gBands:0, g:["#1a0f2e","#c2185b","#ffb347"]
};
const DEFAULTS = JSON.parse(JSON.stringify(P));
const COLORS = ["#2b2e36","#141518","#1f5bff","#77787d","#ff7a00","#2f4a3e","#ff2d95"];
const MODES = {
  raise:"adds volume · strokes melt together",
  stack:"strokes stack on top of each other",
  plate:"flat plateaus with a bevelled edge",
  carve:"engraves into the surface"
};

// ---------- GL ----------
const cv = $("gl");
const gl = cv.getContext("webgl2", {preserveDrawingBuffer:true, antialias:false});
if (!gl) { $("err").style.display = "block"; cv.style.display = "none"; return; }

const stage = $("stage");
let docPerCss = 1;
const W = 2400, H = 1600; // landscape 3:2, fixed high-res plate
cv.width = W; cv.height = H;

const N = W*H;
const height = new Float32Array(N), snapH = new Float32Array(N);
const color = new Uint8Array(N*4), snapC = new Uint8Array(N*4);
const sN = new Float32Array(N), sR = new Float32Array(N);
function paperFill(buf){ for (let i=0;i<N;i++){ const j=i*4; buf[j]=0;buf[j+1]=0;buf[j+2]=0;buf[j+3]=255; } }
paperFill(color);

// ---------- noise tables (512 tileable) ----------
const NS = 512, NM = 511;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function valueNoise(cell, seed){
  const g = NS / cell, R = rng(seed), grid = new Float32Array(g*g);
  for (let i=0;i<g*g;i++) grid[i] = R();
  const out = new Float32Array(NS*NS);
  for (let y=0;y<NS;y++){ const gy=y/cell, y0=Math.floor(gy), fy=gy-y0, sy=fy*fy*(3-2*fy);
    const r0=(y0%g)*g, r1=((y0+1)%g)*g;
    for (let x=0;x<NS;x++){ const gx=x/cell, x0=Math.floor(gx), fx=gx-x0, sx=fx*fx*(3-2*fx);
      const c0=x0%g, c1=(x0+1)%g;
      const a=grid[r0+c0]+(grid[r0+c1]-grid[r0+c0])*sx, b=grid[r1+c0]+(grid[r1+c1]-grid[r1+c0])*sx;
      out[y*NS+x]=a+(b-a)*sy; } }
  return out;
}
const low = new Float32Array(NS*NS), fine = new Float32Array(NS*NS), dent = new Float32Array(NS*NS);
{
  const a=valueNoise(32,11), b=valueNoise(16,12), c=valueNoise(8,13);
  const d=valueNoise(4,21), e=valueNoise(2,22), R=rng(99);
  for (let i=0;i<NS*NS;i++){ low[i]=a[i]*.55+b[i]*.3+c[i]*.15; fine[i]=d[i]*.45+e[i]*.35+R()*.2; }
  const Rd = rng(7);
  for (let k=0;k<1100;k++){
    const cx=Rd()*NS, cy=Rd()*NS, r=1.2+Rd()*Rd()*4.5, dep=.4+Rd()*.6, m=Math.ceil(r);
    for (let y=-m;y<=m;y++) for (let x=-m;x<=m;x++){
      const dd=(x*x+y*y)/(r*r); if (dd>=1) continue;
      const idx=(((cy+y)|0)&NM)*NS+(((cx+x)|0)&NM);
      dent[idx]=Math.max(dent[idx],(1-dd)*dep);
    }
  }
}

// ---------- shaders ----------
const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.-1., 0., 1.); }`;
const FS = `#version 300 es
precision highp float; precision highp int;
uniform highp sampler2D uH; uniform highp sampler2D uC;
uniform ivec2 uSize; uniform vec3 uL; uniform float uAO, uDepth, uGloss; uniform vec3 uPaper;
uniform float uGAmt, uGRange, uGBal, uGBands; uniform vec3 uG0, uG1, uG2;
out vec4 o;
float Hf(ivec2 p){ p = clamp(p, ivec2(0), uSize-1); return texelFetch(uH, p, 0).r; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  ivec2 p = ivec2(int(gl_FragCoord.x), uSize.y-1-int(gl_FragCoord.y));
  float h = Hf(p);
  float tl=Hf(p+ivec2(-1,-1)), tc=Hf(p+ivec2(0,-1)), tr=Hf(p+ivec2(1,-1));
  float ml=Hf(p+ivec2(-1,0)),  mr=Hf(p+ivec2(1,0));
  float bl=Hf(p+ivec2(-1,1)),  bc=Hf(p+ivec2(0,1)),  br=Hf(p+ivec2(1,1));
  float gx = ((tr+2.*mr+br)-(tl+2.*ml+bl))/8.;
  float gy = ((bl+2.*bc+br)-(tl+2.*tc+tr))/8.;
  vec3 n = normalize(vec3(-gx*uDepth, -gy*uDepth, 1.));
  vec4 c = texelFetch(uC, p, 0);
  int id = int(c.a*255.+.5);
  vec3 alb = pow(id==255 ? uPaper : c.rgb, vec3(2.2));
  // height gradient map: colour follows elevation
  if (id!=255 && uGAmt>0.){
    float t = pow(clamp(h/uGRange, 0., 1.), uGBal);
    if (uGBands>1.5) t = min(floor(t*uGBands), uGBands-1.)/(uGBands-1.);
    vec3 g = t<.5 ? mix(uG0, uG1, t*2.) : mix(uG1, uG2, t*2.-1.);
    alb = mix(alb, pow(g, vec3(2.2)), uGAmt);
  }

  float s = 1.; // no cast shadows

  // ambient occlusion from neighbourhood height
  float sum=0.;
  if (uAO>0.) for (int i=0;i<8;i++){ float a=float(i)*.785398;
    vec2 dir=vec2(cos(a),sin(a));
    sum += Hf(p+ivec2(dir*4.)) + Hf(p+ivec2(dir*11.)); }
  float ao = clamp(1.-max(sum/16.-h,0.)*.06*uAO, .3, 1.);

  if (id==255) ao = 1.; // keep the plate clean, no halo around strokes
  float ndl = max(dot(n,uL),0.);
  float kd=1., ks=.03, sh=8.; vec3 sc=vec3(1.);
  kd=.9; ks=mix(.03,.75,uGloss); sh=mix(8.,120.,uGloss*uGloss);
  if (id==1){ kd=.82; ks=1.1; sh=220.; }
  vec3 Hv = normalize(uL+vec3(0,0,1));
  float spec = pow(max(dot(n,Hv),0.), sh)*ks*(sh+8.)/60.;
  vec3 col = alb*(vec3(.33)*ao + kd*ndl*s*1.05) + sc*spec*s;
  if (id==1){ vec3 r = reflect(vec3(0,0,-1), n); col += (alb*.5+.08)*(smoothstep(-.2,.9,-r.y)*.35) + spec*.6; }
  if (id==255){ col = alb*(.33+kd*ndl*1.05)/(.33+kd*max(uL.z,.05)*1.05); }
  else col *= 1.+(hash(vec2(p))-.5)*.05;
  o = vec4(pow(max(col,0.), vec3(1./2.2)), 1.);
}`;
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());
const U = n => gl.getUniformLocation(prog, n);
const u = {H:U("uH"),C:U("uC"),size:U("uSize"),L:U("uL"),ao:U("uAO"),gloss:U("uGloss"),depth:U("uDepth"),paper:U("uPaper"),gAmt:U("uGAmt"),gRange:U("uGRange"),gBal:U("uGBal"),gBands:U("uGBands"),g0:U("uG0"),g1:U("uG1"),g2:U("uG2")};

function mkTex(unit){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST);
  for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
  return t; }
const hTex = mkTex(0); gl.texImage2D(gl.TEXTURE_2D,0,gl.R32F,W,H,0,gl.RED,gl.FLOAT,height);
const cTex = mkTex(1); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,color);
gl.uniform1i(u.H,0); gl.uniform1i(u.C,1); gl.uniform2i(u.size,W,H);
gl.viewport(0,0,W,H);

let dirty = null, needRender = true, fullNeeded = true, exporting = false;
const dirtyH=[null,null];
function markDirty(x0,y0,x1,y1){
  const k = (x0+x1)*.5 < W/2 ? 0 : 1, d=dirtyH[k];
  if (!d) dirtyH[k]={x0,y0,x1,y1};
  else { d.x0=Math.min(d.x0,x0); d.y0=Math.min(d.y0,y0); d.x1=Math.max(d.x1,x1); d.y1=Math.max(d.y1,y1); }
  dirty=true; needRender = true;
}
function upload(){
  const out=[];
  for (let k=0;k<2;k++){ const d=dirtyH[k]; if (!d) continue; dirtyH[k]=null; out.push(d);
    const {x0,y0,x1,y1}=d, w=x1-x0+1, h=y1-y0+1;
    gl.pixelStorei(gl.UNPACK_ROW_LENGTH, W); gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, x0); gl.pixelStorei(gl.UNPACK_SKIP_ROWS, y0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hTex);
    gl.texSubImage2D(gl.TEXTURE_2D,0,x0,y0,w,h,gl.RED,gl.FLOAT,height);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,cTex);
    gl.texSubImage2D(gl.TEXTURE_2D,0,x0,y0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,color);
  }
  gl.pixelStorei(gl.UNPACK_ROW_LENGTH,0); gl.pixelStorei(gl.UNPACK_SKIP_PIXELS,0); gl.pixelStorei(gl.UNPACK_SKIP_ROWS,0);
  dirty=null; return out;
}
function hex(c){ const n=parseInt(c.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
function render(){
  const rects = upload();
  const full = fullNeeded || !rects.length; fullNeeded=false;
  const a=P.lightA*Math.PI/180, e=P.lightE*Math.PI/180;
  gl.uniform3f(u.L, Math.cos(a)*Math.cos(e), Math.sin(a)*Math.cos(e), Math.sin(e));
  gl.uniform1f(u.ao,P.ao); gl.uniform1f(u.gloss,P.gloss); gl.uniform1f(u.depth,P.depth);
  gl.uniform3fv(u.paper, hex(P.paper));
  gl.uniform1f(u.gAmt,P.gAmt); gl.uniform1f(u.gRange,P.gRange); gl.uniform1f(u.gBal,P.gBal); gl.uniform1f(u.gBands,P.gBands);
  gl.uniform3fv(u.g0,hex(P.g[0])); gl.uniform3fv(u.g1,hex(P.g[1])); gl.uniform3fv(u.g2,hex(P.g[2]));
  if (full){ gl.disable(gl.SCISSOR_TEST); gl.drawArrays(gl.TRIANGLES,0,3); return; }
  gl.enable(gl.SCISSOR_TEST);
  for (const d of rects){
    const m=16, x0=Math.max(0,d.x0-m), x1=Math.min(W-1,d.x1+m), y0=Math.max(0,d.y0-m), y1=Math.min(H-1,d.y1+m);

float aoAt(ivec2 p){ float h=Hf(p), sum=0.;

  return clamp(1.-max(sum/16.-h,0.)*.06*uAO, .3, 1.); }
float liqAt(ivec2 p){ return int(texelFetch(uC, clamp(p,ivec2(0),uSize-1), 0).a*255.+.5)==1 ? 1. : 0.; }
vec4 albAt(ivec2 p){ vec4 c=texelFetch(uC, clamp(p,ivec2(0),uSize-1), 0); int id=int(c.a*255.+.5);
  return id==255 ? vec4(pow(uPaper,vec3(2.2)),1.) : vec4(pow(c.rgb,vec3(2.2)),0.); }
void main(){
  vec2 op = uOff + gl_FragCoord.xy;
  vec2 q = vec2(op.x, uOH-op.y)/uScale;
  vec2 f = q-.5, fi = floor(f), t = f-fi; ivec2 a = ivec2(fi), b=a+ivec2(1,0), c=a+ivec2(0,1), d=a+ivec2(1,1);
  vec3 n = normalize(mix(mix(nrm(a),nrm(b),t.x), mix(nrm(c),nrm(d),t.x), t.y));
  float ao = mix(mix(aoAt(a),aoAt(b),t.x), mix(aoAt(c),aoAt(d),t.x), t.y);
  // smooth contour: paint colour averaged over paint texels only, edge = iso-line of the coverage
  vec4 Aa=albAt(a), Ab=albAt(b), Ac=albAt(c), Ad=albAt(d);
  float lw = (1.-t.x)*(1.-t.y)*liqAt(a) + t.x*(1.-t.y)*liqAt(b) + (1.-t.x)*t.y*liqAt(c) + t.x*t.y*liqAt(d);
  float wa=(1.-t.x)*(1.-t.y), wb=t.x*(1.-t.y), wc=(1.-t.x)*t.y, wd=t.x*t.y;
  float pw = wa*Aa.w + wb*Ab.w + wc*Ac.w + wd*Ad.w;
  vec3 pc = (Aa.rgb*wa*(1.-Aa.w) + Ab.rgb*wb*(1.-Ab.w) + Ac.rgb*wc*(1.-Ac.w) + Ad.rgb*wd*(1.-Ad.w)) / max(1.-pw, 1e-4);
  float edge = smoothstep(.5-.75/uScale, .5+.75/uScale, pw);
  vec4 A = vec4(pw>.9999 ? pow(uPaper,vec3(2.2)) : pc, edge);
  // smooth paint/wall boundary: cubic B-spline of the paper mask, then a crisp threshold on that smooth contour
  vec4 wx = vec4(pow(1.-t.x,3.), 3.*t.x*t.x*t.x-6.*t.x*t.x+4., -3.*t.x*t.x*t.x+3.*t.x*t.x+3.*t.x+1., t.x*t.x*t.x)/6.;
  vec4 wy = vec4(pow(1.-t.y,3.), 3.*t.y*t.y*t.y-6.*t.y*t.y+4., -3.*t.y*t.y*t.y+3.*t.y*t.y+3.*t.y+1., t.y*t.y*t.y)/6.;
  float m=0.;
  for (int j=0;j<4;j++) for (int i=0;i<4;i++){
    ivec2 pp=clamp(a+ivec2(i-1,j-1), ivec2(0), uSize-1);
    float pap = int(texelFetch(uC,pp,0).a*255.+.5)==255 ? 1. : 0.;
    m += pap*wx[i]*wy[j];
  }
  float aa = .75/uScale;
  A.w = smoothstep(.5-aa, .5+aa, m);
  float ndl = max(dot(n,uL),0.), kd=mix(.9,.82,lw), ks=mix(mix(.03,.75,uGloss),1.1,lw), sh=mix(mix(8.,120.,uGloss*uGloss),220.,lw);
  vec3 Hv = normalize(uL+vec3(0,0,1));

  vec3 colP = A.rgb*(vec3(.33)*ao + kd*ndl*1.05) + spec;
  vec3 rr = reflect(vec3(0,0,-1), n); colP += lw*((A.rgb*.5+.08)*(smoothstep(-.2,.9,-rr.y)*.35) + spec*.6);
  colP *= 1.+(hash(floor(q*2.))-.5)*.05;
  vec3 colW = pow(uPaper,vec3(2.2))*(.33+kd*ndl*1.05)/(.33+kd*max(uL.z,.05)*1.05);
  o = vec4(pow(max(mix(colP,colW,A.w),0.), vec3(1./2.2)), 1.);
}`;
  let progX=null, ux=null;
  function initX(){
    if (progX) return;
    progX=gl.createProgram();
    gl.attachShader(progX, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(progX, sh(gl.FRAGMENT_SHADER, FSX)); gl.linkProgram(progX);
    const G=n=>gl.getUniformLocation(progX,n);
    ux={H:G("uH"),C:G("uC"),size:G("uSize"),L:G("uL"),ao:G("uAO"),gloss:G("uGloss"),depth:G("uDepth"),paper:G("uPaper"),scale:G("uScale"),oh:G("uOH"),off:G("uOff")};

  const chunk=(type,data)=>{ const c=new Uint8Array(12+data.length), dv=new DataView(c.buffer);
    dv.setUint32(0,data.length); for (let i=0;i<4;i++) c[4+i]=type.charCodeAt(i); c.set(data,8);
    dv.setUint32(8+data.length, crc32(c.subarray(4,8+data.length))); return c; };
  async function exportPNG(scale, ppi){
    initX(); upload(); exporting=true;
    const OW=W*scale, OH=H*scale, TS=1024;
    const fbTex=gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,fbTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,TS,TS,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fbTex,0);
    gl.useProgram(progX); gl.disable(gl.SCISSOR_TEST);
    const a=P.lightA*Math.PI/180, e=P.lightE*Math.PI/180;
    gl.uniform1i(ux.H,0); gl.uniform1i(ux.C,1); gl.uniform2i(ux.size,W,H);
    gl.uniform3f(ux.L, Math.cos(a)*Math.cos(e), Math.sin(a)*Math.cos(e), Math.sin(e));
    gl.uniform1f(ux.ao,P.ao); gl.uniform1f(ux.gloss,P.gloss); gl.uniform1f(ux.depth,P.depth);
    gl.uniform3fv(ux.paper, hex(P.paper)); gl.uniform1f(ux.scale,scale); gl.uniform1f(ux.oh,OH);

    const parts=[]; const reading=(async()=>{ const rd=cs.readable.getReader(); for(;;){ const {done,value}=await rd.read(); if (done) break; parts.push(value); } })();
    const px=new Uint8Array(TS*TS*4), rowB=OW*3+1;
    try{
      for (let y0=0; y0<OH; y0+=TS){
        const bh=Math.min(TS,OH-y0), band=new Uint8Array(rowB*bh), by=OH-y0-bh;
        for (let x0=0; x0<OW; x0+=TS){
          const bw=Math.min(TS,OW-x0);
          gl.viewport(0,0,bw,bh); gl.uniform2f(ux.off,x0,by); gl.drawArrays(gl.TRIANGLES,0,3);
          gl.readPixels(0,0,bw,bh,gl.RGBA,gl.UNSIGNED_BYTE,px);
          for (let r=0;r<bh;r++){ const dst=(bh-1-r)*rowB+1+x0*3; let s=r*bw*4;
            for (let x=0;x<bw;x++,s+=4){ const d=dst+x*3; band[d]=px[s]; band[d+1]=px[s+1]; band[d+2]=px[s+2]; } }
        }
        for (let r=0;r<bh;r++){ const o=r*rowB; band[o]=1;               // PNG "Sub" filter, right to left
          for (let i=o+rowB-1;i>=o+4;i--) band[i]=(band[i]-band[i-3])&255; }
        await wr.ready; await wr.write(band);
        await new Promise(res=>setTimeout(res,0));                         // keep the page responsive
      }
      await wr.close(); await reading;
    } finally {
      gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteFramebuffer(fb); gl.deleteTexture(fbTex);
      gl.useProgram(prog); gl.viewport(0,0,W,H); gl.activeTexture(gl.TEXTURE0);
      exporting=false; fullNeeded=true; needRender=true;
    }
    const ih=new Uint8Array(13), dv=new DataView(ih.buffer); dv.setUint32(0,OW); dv.setUint32(4,OH); ih[8]=8; ih[9]=2;
    const ph=new Uint8Array(9), pv=new DataView(ph.buffer), ppm=Math.round(ppi/0.0254); pv.setUint32(0,ppm); pv.setUint32(4,ppm); ph[8]=1;
    let n=0; for (const p of parts) n+=p.length; const idat=new Uint8Array(n); n=0; for (const p of parts){ idat.set(p,n); n+=p.length; }
    return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]), chunk("IHDR",ih), chunk("pHYs",ph), chunk("IDAT",idat), chunk("IEND",new Uint8Array(0))],{type:"image/png"});
  }
  let xScale=3;
  document.querySelectorAll("#xsz button").forEach(b=>b.onclick=()=>{ xScale=+b.dataset.s;
    document.querySelectorAll("#xsz button").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  $("expR").onclick = async () => {
    const btn=$("expR"), label=btn.textContent; btn.disabled=true; btn.textContent="exporting…";
    try{
      let blob;
      if (typeof CompressionStream==="function") blob=await exportPNG(xScale,300);
      else { fullNeeded=true; render(); blob=await new Promise(r=>cv.toBlob(r,"image/png")); blob=await withPPI(blob,300); }
      btn.textContent=label; await save(`relief-canvas-${W*xScale}x${H*xScale}.png`, blob, btn);
    } catch(err){ console.error(err); }
    btn.textContent=label; btn.disabled=false;
  };
})();
})();
